<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="38%" cy="30%" r="85%">
      <stop offset="0" stop-color="#1C6B43"/>
      <stop offset="0.55" stop-color="#0E4229"/>
      <stop offset="1" stop-color="#05200F"/>
    </radialGradient>
    <linearGradient id="lane" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DF5A6"/>
      <stop offset="1" stop-color="#25B862"/>
    </linearGradient>
    <radialGradient id="ballg" cx="35%" cy="32%" r="80%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9CFCB"/>
    </radialGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="10" dy="22" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- mowing stripes -->
  <g fill="#FFFFFF" opacity="0.035">
    <rect x="0" y="0" width="128" height="1024"/><rect x="256" y="0" width="128" height="1024"/>
    <rect x="512" y="0" width="128" height="1024"/><rect x="768" y="0" width="128" height="1024"/>
  </g>
  <!-- chalk: centre circle arc + halfway line -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="14">
    <circle cx="512" cy="1024" r="300"/>
    <path d="M0 1024 H1024"/>
    <rect x="262" y="-14" width="500" height="200" rx="0"/>
  </g>
  <!-- lane glow -->
  <path d="M300 724 Q 330 330 724 300" fill="none" stroke="#7DF5A6" stroke-opacity="0.45" stroke-width="54" stroke-linecap="round" filter="url(#glow)"/>
  <!-- pass lane -->
  <path d="M300 724 Q 330 330 724 300" fill="none" stroke="url(#lane)" stroke-width="30" stroke-linecap="round" stroke-dasharray="2 62"/>
  <path d="M300 724 Q 330 330 724 300" fill="none" stroke="url(#lane)" stroke-width="22" stroke-linecap="round" stroke-dasharray="0" opacity="0"/>
  <!-- players -->
  <g filter="url(#sh)">
    <circle cx="300" cy="724" r="112" fill="url(#disc)"/>
    <circle cx="724" cy="300" r="112" fill="url(#disc)"/>
  </g>
  <circle cx="300" cy="724" r="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="14"/>
  <circle cx="724" cy="300" r="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="14"/>
  <circle cx="300" cy="724" r="70" fill="none" stroke="#0A3A22" stroke-opacity="0.18" stroke-width="10"/>
  <circle cx="724" cy="300" r="70" fill="none" stroke="#0A3A22" stroke-opacity="0.18" stroke-width="10"/>
  <!-- ball arriving -->
  <g filter="url(#sh)">
    <circle cx="550" cy="338" r="62" fill="url(#ballg)"/>
  </g>
  <polygon points="550,308 578.5,328.7 567.6,362.3 532.4,362.3 521.5,328.7" fill="#1B2420"/>
  <g stroke="#1B2420" stroke-width="7" stroke-linecap="round">
    <path d="M550 308 L550 278"/><path d="M578.5 328.7 L607 319"/><path d="M567.6 362.3 L586 387"/>
    <path d="M532.4 362.3 L514 387"/><path d="M521.5 328.7 L493 319"/>
  </g>
  <circle cx="550" cy="338" r="62" fill="none" stroke="#1B2420" stroke-opacity="0.6" stroke-width="6"/>
</svg>
